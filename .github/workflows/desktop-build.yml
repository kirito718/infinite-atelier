name: Desktop Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:all

  container-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build and run the real image, recreate containers without dropping their
      # named volume, and exercise auth/storage/Codex status without real OAuth.
      - run: node web/scripts/verify-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-acceptance
          path: web/output/container-acceptance/**
          if-no-files-found: warn
          retention-days: 7
